<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 396" width="644" height="396" role="img" aria-label="Terminal window running Code Campus (light mode)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Code Campus terminal (light)</title>
  <defs>
    <!-- solid light body: stays light on ANY background -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1f2ff"/>
      <stop offset="1" stop-color="#dcdfff"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a70" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#b9bff5" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#3b3f8f" flood-opacity="0.28"/>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
      .ln{font-size:14.5px;fill:#0a0a22;opacity:0;animation:in .5s ease-out forwards}
      .l1{animation-delay:.3s}.l2{animation-delay:.9s}.l3{animation-delay:1.5s}.l4{animation-delay:2.1s}.l5{animation-delay:2.7s}
      .p{fill:#5b6cff}.h{fill:#d97706;font-weight:600}.ok{fill:#16a34a}
      .cur{fill:#ff6a45;animation:blink 1s steps(1) infinite}
      @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
      @keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
      @media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}.cur{animation:none}}
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="16" width="604" height="352" rx="28" fill="url(#body)"/>
  </g>
  <rect x="20" y="16" width="604" height="352" rx="28" fill="url(#tint)"/>
  <rect x="20.5" y="16.5" width="603" height="351" rx="27.5" fill="none" stroke="url(#edge)"/>
  <rect x="44" y="17" width="556" height="1.5" fill="url(#top)"/>

  <circle cx="48" cy="40" r="6" fill="#ff5f57"/>
  <circle cx="70" cy="40" r="6" fill="#febc2e"/>
  <circle cx="92" cy="40" r="6" fill="#28c840"/>
  <text x="360" y="44" text-anchor="middle" class="mono" font-size="12" fill="#4a4e7a" fill-opacity="0.9">Code Campus</text>

  <g class="mono" xml:space="preserve">
    <text class="ln l1" x="48" y="98"><tspan class="p">$</tspan> cd <tspan class="h">code-campus</tspan></text>
    <text class="ln l2" x="48" y="128"><tspan class="p">$</tspan> npm run start</text>
    <text class="ln l3" x="48" y="158">compiling lessons ...</text>
    <text class="ln l4" x="48" y="188">loading HTML, CSS, JavaScript engines ...</text>
    <text class="ln l5" x="48" y="218"><tspan class="ok">✓</tspan> <tspan class="h">Code Campus</tspan> is running on localhost <tspan class="cur">█</tspan></text>
  </g>
</svg>
